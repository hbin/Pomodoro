name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BETA_TAG: beta
  BETA_DOWNLOAD_PREFIX: https://github.com/hbin/Pomodoro/releases/download/beta/

jobs:
  preflight:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.preflight.outputs.VERSION }}
      build: ${{ steps.preflight.outputs.BUILD }}
      channel: ${{ steps.preflight.outputs.CHANNEL }}
      tag: ${{ steps.preflight.outputs.TAG }}
      tag_object_sha: ${{ steps.preflight.outputs.TAG_OBJECT_SHA }}
      peeled_sha: ${{ steps.preflight.outputs.PEELED_SHA }}
      main_snapshot: ${{ steps.preflight.outputs.MAIN_SNAPSHOT }}
      signing_kind: ${{ steps.preflight.outputs.SIGNING_KIND }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch current main
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

      - name: Validate tag, ancestry, and credentials
        id: preflight
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          RESULT="$(./scripts/release-preflight.sh "$GITHUB_REF_NAME")"
          printf '%s\n' "$RESULT"
          printf '%s\n' "$RESULT" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
      PEELED_SHA: ${{ needs.preflight.outputs.peeled_sha }}
      MAIN_SNAPSHOT: ${{ needs.preflight.outputs.main_snapshot }}
      SIGNING_KIND: ${{ needs.preflight.outputs.signing_kind }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Import Developer ID certificate
        if: env.SIGNING_KIND == 'developer-id'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi

          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Generate release notes
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          TAG_SUMMARY="$(git tag -l --format='%(contents:subject)' "$TAG" | head -n 1)"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${PEELED_SHA}^" 2>/dev/null || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMITS="$(git log "$PREVIOUS_TAG..$PEELED_SHA" --no-merges --pretty='- %s' \
              | grep -vE '^- (Bump version to|Release v)' || true)"
            FULL_CHANGELOG="https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
          else
            COMMITS="$(git log "$PEELED_SHA" --no-merges --pretty='- %s' \
              | grep -vE '^- (Bump version to|Release v)' || true)"
            FULL_CHANGELOG=""
          fi

          SUMMARY_TEXT=""
          if [[ -n "$TAG_SUMMARY" && ! "$TAG_SUMMARY" =~ ^(Pomodoro|Release)[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            SUMMARY_TEXT="$TAG_SUMMARY"
          elif [[ -n "$COMMITS" ]]; then
            COMMIT_COUNT="$(printf '%s\n' "$COMMITS" | sed '/^$/d' | wc -l | tr -d ' ')"
            if (( COMMIT_COUNT > 5 )); then
              COMMITS="$(printf '%s\n- …and %s more changes' \
                "$(printf '%s\n' "$COMMITS" | head -n 5)" \
                "$((COMMIT_COUNT - 5))")"
            fi
          fi

          if [[ "$SIGNING_KIND" == "developer-id" ]]; then
            SIGNING_NOTE="Signing: Developer ID Application; app and DMG notarized and stapled."
          else
            SIGNING_NOTE="Signing: ad-hoc (signing and notarization secrets are unavailable)."
          fi

          mkdir -p dist
          {
            echo "## Summary"
            echo
            if [[ -n "$SUMMARY_TEXT" ]]; then
              echo "$SUMMARY_TEXT"
            elif [[ -n "$COMMITS" ]]; then
              echo "This release includes:"
              echo
              printf '%s\n' "$COMMITS"
            else
              echo "Maintenance release with no user-facing changes."
            fi
            if [[ -n "$FULL_CHANGELOG" ]]; then
              echo
              echo "**Full Changelog**: $FULL_CHANGELOG"
            fi
            echo
            echo "$SIGNING_NOTE"
          } > "dist/Pomodoro-$VERSION.md"

          if [[ "$CHANNEL" == "beta" ]]; then
            {
              echo "This is the rolling beta channel that in-app beta updates read."
              echo
              echo "Download \`Pomodoro-$VERSION.zip\` or install the DMG from the"
              echo "\`v$VERSION\` pre-release, then switch on **Beta updates** in"
              echo "Settings."
              echo
              cat "dist/Pomodoro-$VERSION.md"
            } > dist/Pomodoro-beta.md
          fi

      - name: Build and sign the app once
        run: |
          set -euo pipefail

          SIGN_IDENTITY="${SIGN_IDENTITY:--}"
          CONFIG=release UNIVERSAL=1 SIGN_IDENTITY="$SIGN_IDENTITY" \
            ./scripts/build-app.sh release
          codesign --verify --deep --strict --verbose=2 build/Pomodoro.app

          if [[ "$SIGNING_KIND" == "developer-id" ]]; then
            if [[ -z "${SIGN_IDENTITY:-}" || "$SIGN_IDENTITY" != Developer\ ID\ Application:* ]]; then
              echo "::error::Developer ID signing was required, but SIGN_IDENTITY is '${SIGN_IDENTITY:-}'."
              exit 1
            fi
            if ! codesign --display --verbose=4 build/Pomodoro.app 2>&1 \
              | grep -F "Authority=Developer ID Application:" >/dev/null; then
              echo "::error::Built app is not signed by a Developer ID Application identity."
              exit 1
            fi
          elif [[ "$CHANNEL" == "stable" ]]; then
            echo "::error::Stable releases require Developer ID signing."
            exit 1
          fi

      - name: Notarize and staple the app
        if: env.SIGNING_KIND == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          APP_ZIP="$RUNNER_TEMP/Pomodoro-app.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Pomodoro.app "$APP_ZIP"

          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple build/Pomodoro.app
          xcrun stapler validate build/Pomodoro.app
          spctl --assess --type execute --verbose=4 build/Pomodoro.app

      - name: Package the stapled app
        run: |
          set -euo pipefail

          SKIP_BUILD=1 \
          CONFIG=release \
          UNIVERSAL=1 \
          SIGN_IDENTITY="${SIGN_IDENTITY:--}" \
          ./scripts/package-dmg.sh

      - name: Notarize and staple the disk image
        if: env.SIGNING_KIND == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          codesign --verify --deep --strict --verbose=2 dist/Pomodoro.dmg
          xcrun notarytool submit dist/Pomodoro.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Pomodoro.dmg
          xcrun stapler validate dist/Pomodoro.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 dist/Pomodoro.dmg

      - name: Generate the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if [[ ! -s "$KEY_FILE" ]]; then
            echo "::error::The Sparkle private key is empty."
            exit 1
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            ./scripts/make-appcast.sh \
              --version "$VERSION" \
              --zip "dist/Pomodoro-$VERSION.zip" \
              --notes "dist/Pomodoro-$VERSION.md" \
              --key-file "$KEY_FILE" \
              --channel beta \
              --download-prefix "$BETA_DOWNLOAD_PREFIX" \
              --output dist/appcast.xml
          else
            ./scripts/make-appcast.sh \
              --version "$VERSION" \
              --zip "dist/Pomodoro-$VERSION.zip" \
              --notes "dist/Pomodoro-$VERSION.md" \
              --key-file "$KEY_FILE" \
              --output dist/appcast.xml
          fi

      - name: Refresh checksums and write build metadata
        run: |
          set -euo pipefail

          (
            cd dist
            shasum -a 256 Pomodoro.dmg > Pomodoro.dmg.sha256
            shasum -a 256 "Pomodoro-$VERSION.zip" > "Pomodoro-$VERSION.zip.sha256"
          )

          DMG_SHA256="$(shasum -a 256 dist/Pomodoro.dmg | awk '{print $1}')"
          ZIP_SHA256="$(shasum -a 256 "dist/Pomodoro-$VERSION.zip" | awk '{print $1}')"
          APPCAST_SHA256="$(shasum -a 256 dist/appcast.xml | awk '{print $1}')"

          if [[ "$SIGNING_KIND" == "developer-id" ]]; then
            SIGNING_LABEL="${SIGN_IDENTITY:-}"
            APP_NOTARIZED=true
            DMG_NOTARIZED=true
          else
            SIGNING_LABEL=ad-hoc
            APP_NOTARIZED=false
            DMG_NOTARIZED=false
          fi

          {
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "CHANNEL=$CHANNEL"
            echo "TAG_OBJECT_SHA=$TAG_OBJECT_SHA"
            echo "PEELED_SHA=$PEELED_SHA"
            echo "MAIN_SNAPSHOT=$MAIN_SNAPSHOT"
            echo "SIGNING_KIND=$SIGNING_KIND"
            echo "SIGNING_LABEL=$SIGNING_LABEL"
            echo "APP_NOTARIZED=$APP_NOTARIZED"
            echo "DMG_NOTARIZED=$DMG_NOTARIZED"
            echo "DMG_SHA256=$DMG_SHA256"
            echo "ZIP_SHA256=$ZIP_SHA256"
            echo "APPCAST_SHA256=$APPCAST_SHA256"
          } > dist/build-info.txt

          {
            echo "### Release artifacts ready"
            echo
            echo "- Version: \`$VERSION\` (\`$BUILD\`)"
            echo "- Channel: \`$CHANNEL\`"
            echo "- Signing: \`$SIGNING_LABEL\`"
            echo "- App notarized: \`$APP_NOTARIZED\`"
            echo "- DMG notarized: \`$DMG_NOTARIZED\`"
            echo "- DMG SHA-256: \`$DMG_SHA256\`"
            if [[ "$CHANNEL" == "stable" ]]; then
              echo
              echo "Set repository variable \`RELEASE_APPROVED_DIGEST\` to the DMG SHA-256, then approve the \`release\` environment."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_APPROVED_DIGEST: ${{ vars.RELEASE_APPROVED_DIGEST }}

    steps:
      - name: Download the verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ github.ref_name }}
          path: dist

      - name: Verify the exact release artifact
        run: |
          set -euo pipefail

          info() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' dist/build-info.txt
          }

          VERSION="$(info VERSION)"
          CHANNEL="$(info CHANNEL)"
          SIGNING_KIND="$(info SIGNING_KIND)"
          SIGNING_LABEL="$(info SIGNING_LABEL)"
          APP_NOTARIZED="$(info APP_NOTARIZED)"
          DMG_NOTARIZED="$(info DMG_NOTARIZED)"
          DMG_SHA256="$(info DMG_SHA256)"
          ZIP_SHA256="$(info ZIP_SHA256)"
          APPCAST_SHA256="$(info APPCAST_SHA256)"

          [[ -n "$VERSION" && -n "$CHANNEL" && -n "$SIGNING_KIND" && -n "$SIGNING_LABEL" ]] \
            || { echo "::error::dist/build-info.txt is incomplete."; exit 1; }
          [[ -f "dist/Pomodoro-$VERSION.md" ]] \
            || { echo "::error::Release notes are missing."; exit 1; }
          [[ "$(shasum -a 256 dist/Pomodoro.dmg | awk '{print $1}')" == "$DMG_SHA256" ]] \
            || { echo "::error::DMG digest does not match build-info.txt."; exit 1; }
          [[ "$(shasum -a 256 "dist/Pomodoro-$VERSION.zip" | awk '{print $1}')" == "$ZIP_SHA256" ]] \
            || { echo "::error::ZIP digest does not match build-info.txt."; exit 1; }
          [[ "$(shasum -a 256 dist/appcast.xml | awk '{print $1}')" == "$APPCAST_SHA256" ]] \
            || { echo "::error::Appcast digest does not match build-info.txt."; exit 1; }
          (
            cd dist
            shasum -a 256 -c Pomodoro.dmg.sha256
            shasum -a 256 -c "Pomodoro-$VERSION.zip.sha256"
          )
          unzip -t "dist/Pomodoro-$VERSION.zip"
          hdiutil verify dist/Pomodoro.dmg

          if [[ "$CHANNEL" == "stable" ]]; then
            [[ -n "${RELEASE_APPROVED_DIGEST:-}" ]] \
              || { echo "::error::RELEASE_APPROVED_DIGEST is not set."; exit 1; }
            [[ "$RELEASE_APPROVED_DIGEST" == "$DMG_SHA256" ]] \
              || { echo "::error::RELEASE_APPROVED_DIGEST does not match the DMG digest."; exit 1; }
            [[ "$SIGNING_KIND" == "developer-id" ]] \
              || { echo "::error::Stable releases require Developer ID signing."; exit 1; }
            [[ "$APP_NOTARIZED" == "true" && "$DMG_NOTARIZED" == "true" ]] \
              || { echo "::error::Stable releases require stapled app and DMG notarization."; exit 1; }
          fi

          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k "dist/Pomodoro-$VERSION.zip" "$VERIFY_DIR"
          APP="$VERIFY_DIR/Pomodoro.app"
          [[ -d "$APP" ]] || { echo "::error::The update ZIP does not contain Pomodoro.app."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

          if [[ "$SIGNING_KIND" == "developer-id" ]]; then
            if ! codesign --display --verbose=4 "$APP" 2>&1 \
              | grep -F "Authority=Developer ID Application:" >/dev/null; then
              echo "::error::The update ZIP app is not signed by a Developer ID Application identity."
              exit 1
            fi
            if ! codesign --display --verbose=4 dist/Pomodoro.dmg 2>&1 \
              | grep -F "Authority=Developer ID Application:" >/dev/null; then
              echo "::error::The DMG is not signed by a Developer ID Application identity."
              exit 1
            fi
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
            codesign --verify --deep --strict --verbose=2 dist/Pomodoro.dmg
            xcrun stapler validate dist/Pomodoro.dmg
            spctl --assess --type open --context context:primary-signature --verbose=4 dist/Pomodoro.dmg
          else
            [[ "$CHANNEL" == "beta" ]] \
              || { echo "::error::Only beta releases may use the ad-hoc path."; exit 1; }
            [[ "$APP_NOTARIZED" == "false" && "$DMG_NOTARIZED" == "false" ]] \
              || { echo "::error::Ad-hoc releases must not claim notarization."; exit 1; }
            grep -F "Signing: ad-hoc" "dist/Pomodoro-$VERSION.md" >/dev/null \
              || { echo "::error::Ad-hoc release notes are missing the signing label."; exit 1; }
          fi

          {
            echo "VERSION=$VERSION"
            echo "CHANNEL=$CHANNEL"
            echo "SIGNING_KIND=$SIGNING_KIND"
            echo "SIGNING_LABEL=$SIGNING_LABEL"
            echo "DMG_SHA256=$DMG_SHA256"
          } >> "$GITHUB_ENV"

      - name: Recheck the live tag before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          info() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' dist/build-info.txt
          }

          TAG_OBJECT_SHA="$(info TAG_OBJECT_SHA)"
          PEELED_SHA="$(info PEELED_SHA)"
          [[ -n "$TAG_OBJECT_SHA" && -n "$PEELED_SHA" ]] \
            || { echo "::error::build-info.txt is missing the tag object or peeled commit."; exit 1; }

          LIVE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          LIVE_TAG_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)"
          [[ "$LIVE_TAG_TYPE" == "tag" ]] \
            || { echo "::error::Live tag $GITHUB_REF_NAME is not an annotated tag object (type: $LIVE_TAG_TYPE)."; exit 1; }
          [[ "$LIVE_TAG_SHA" == "$TAG_OBJECT_SHA" ]] \
            || { echo "::error::Live tag object moved since build: $LIVE_TAG_SHA != $TAG_OBJECT_SHA."; exit 1; }

          LIVE_COMMIT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$LIVE_TAG_SHA" --jq .object.sha)"
          [[ "$LIVE_COMMIT_SHA" == "$PEELED_SHA" ]] \
            || { echo "::error::Live tag peels to $LIVE_COMMIT_SHA, not $PEELED_SHA."; exit 1; }

          COMPARE_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/${PEELED_SHA}...main" --jq .status)"
          if [[ "$COMPARE_STATUS" != "ahead" && "$COMPARE_STATUS" != "identical" ]]; then
            echo "::error::Peeled tag commit is not reachable from main (compare status: $COMPARE_STATUS)."
            exit 1
          fi

          echo "Live tag recheck passed: $GITHUB_REF_NAME -> $LIVE_TAG_SHA -> $PEELED_SHA (main: $COMPARE_STATUS)."

      - name: Create, upload, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FILES=(
            dist/Pomodoro.dmg
            dist/Pomodoro.dmg.sha256
            "dist/Pomodoro-$VERSION.zip"
            "dist/Pomodoro-$VERSION.zip.sha256"
            dist/appcast.xml
            dist/build-info.txt
          )
          NOTES="dist/Pomodoro-$VERSION.md"
          RELEASE_FLAGS=()
          if [[ "$CHANNEL" == "beta" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            [[ "$IS_DRAFT" == "true" ]] \
              || { echo "::error::Release $GITHUB_REF_NAME is already published."; exit 1; }
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              --draft=false \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --draft \
              --verify-tag \
              --title "Pomodoro $VERSION" \
              --notes-file "$NOTES" \
              "${RELEASE_FLAGS[@]}"
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              "${RELEASE_FLAGS[@]}"
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            if ! gh release view "$BETA_TAG" >/dev/null 2>&1; then
              gh release create "$BETA_TAG" \
                --prerelease \
                --title "Pomodoro Beta" \
                --notes-file dist/Pomodoro-beta.md \
                --target "$GITHUB_SHA"
            fi
            gh release upload "$BETA_TAG" \
              "dist/Pomodoro-$VERSION.zip" \
              dist/appcast.xml \
              --clobber
            gh release edit "$BETA_TAG" \
              --title "Pomodoro Beta" \
              --notes-file dist/Pomodoro-beta.md
          else
            if gh release view "$BETA_TAG" >/dev/null 2>&1; then
              gh release upload "$BETA_TAG" dist/appcast.xml --clobber
            else
              gh release create "$BETA_TAG" \
                --prerelease \
                --title "Pomodoro Beta" \
                --notes "Rolling beta channel for in-app beta updates. Betas appear here before a release." \
                --target "$GITHUB_SHA" \
                dist/appcast.xml
            fi
          fi

      - name: Write the workflow summary
        run: |
          {
            echo "### Pomodoro $VERSION published"
            echo
            echo "- Channel: \`$CHANNEL\`"
            echo "- Signing: \`$SIGNING_LABEL\`"
            echo "- DMG SHA-256: \`$DMG_SHA256\`"
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
