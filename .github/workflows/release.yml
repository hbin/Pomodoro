name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BETA_TAG: beta
  BETA_DOWNLOAD_PREFIX: https://github.com/hbin/Pomodoro/releases/download/beta/

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the version tag
        run: |
          set -euo pipefail

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"

          if [[ ! "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::CFBundleVersion must be a whole number (got $BUILD)."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::CFBundleShortVersionString must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N (got $VERSION)."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Resources/Info.plist version v$VERSION."
            exit 1
          fi

          if [[ "$VERSION" == *-beta.* ]]; then
            echo "IS_BETA=1" >> "$GITHUB_ENV"
            echo "Release channel: beta"
          else
            echo "IS_BETA=0" >> "$GITHUB_ENV"
            echo "Release channel: stable"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Check the Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY repository secret is required."
            exit 1
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          TAG_REF_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)"
          if [[ "$TAG_REF_TYPE" == "tag" ]]; then
            TAG_OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
            TAG_SUMMARY="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.message | split("\n")[0]')"
          else
            TAG_SUMMARY=""
          fi

          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMITS="$(git log "$PREVIOUS_TAG..$GITHUB_REF_NAME" --no-merges --pretty='- %s' \
              | grep -vE '^- (Bump version to|Release v)' || true)"
            GENERATED_NOTES="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f "tag_name=$GITHUB_REF_NAME" \
              -f "previous_tag_name=$PREVIOUS_TAG" \
              --jq .body)"
          else
            COMMITS="$(git log "$GITHUB_REF_NAME" --no-merges --pretty='- %s' \
              | grep -vE '^- (Bump version to|Release v)' || true)"
            GENERATED_NOTES="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f "tag_name=$GITHUB_REF_NAME" \
              --jq .body)"
          fi

          SUMMARY_TEXT=""
          if [[ -n "$TAG_SUMMARY" && ! "$TAG_SUMMARY" =~ ^(Pomodoro|Release)[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            SUMMARY_TEXT="$TAG_SUMMARY"
          elif [[ -n "$COMMITS" ]]; then
            COMMIT_COUNT="$(printf '%s\n' "$COMMITS" | sed '/^$/d' | wc -l | tr -d ' ')"
            if (( COMMIT_COUNT > 5 )); then
              COMMITS="$(printf '%s\n- …and %s more changes' \
                "$(printf '%s\n' "$COMMITS" | head -n 5)" \
                "$((COMMIT_COUNT - 5))")"
            fi
          fi

          NOTES_FILE="$RUNNER_TEMP/Pomodoro-$VERSION.md"
          {
            echo "## Summary"
            echo
            if [[ -n "$SUMMARY_TEXT" ]]; then
              echo "$SUMMARY_TEXT"
            elif [[ -n "$COMMITS" ]]; then
              echo "This release includes:"
              echo
              printf '%s\n' "$COMMITS"
            else
              echo "Maintenance release with no user-facing changes."
            fi
            echo
            printf '%s\n' "$GENERATED_NOTES"
          } > "$NOTES_FILE"

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

          if [[ "$IS_BETA" == "1" ]]; then
            BETA_NOTES_FILE="$RUNNER_TEMP/Pomodoro-beta.md"
            {
              echo "This is the rolling beta channel that in-app beta updates read."
              echo
              echo "Download \`Pomodoro-$VERSION.zip\` or install the DMG from the"
              echo "\`v$VERSION\` pre-release, then switch on **Beta updates** in"
              echo "Settings."
              echo
              cat "$NOTES_FILE"
            } > "$BETA_NOTES_FILE"
            echo "BETA_NOTES_FILE=$BETA_NOTES_FILE" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi

          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Build the app and disk image
        run: |
          CONFIG=release UNIVERSAL=1 ./scripts/package-dmg.sh

      - name: Generate the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if [[ ! -s "$KEY_FILE" ]]; then
            echo "::error::The Sparkle private key is empty."
            exit 1
          fi

          if [[ "$IS_BETA" == "1" ]]; then
            ./scripts/make-appcast.sh \
              --version "$VERSION" \
              --zip "dist/Pomodoro-$VERSION.zip" \
              --notes "$NOTES_FILE" \
              --key-file "$KEY_FILE" \
              --channel beta \
              --download-prefix "$BETA_DOWNLOAD_PREFIX" \
              --output "dist/appcast.xml"
          else
            ./scripts/make-appcast.sh \
              --version "$VERSION" \
              --zip "dist/Pomodoro-$VERSION.zip" \
              --notes "$NOTES_FILE" \
              --key-file "$KEY_FILE" \
              --output "dist/appcast.xml"
          fi

      - name: Notarize the disk image
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail

          xcrun notarytool submit dist/Pomodoro.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Pomodoro.dmg
          xcrun stapler validate dist/Pomodoro.dmg

      - name: Refresh the checksum
        run: |
          cd dist
          shasum -a 256 Pomodoro.dmg > Pomodoro.dmg.sha256
          shasum -a 256 "Pomodoro-$VERSION.zip" > "Pomodoro-$VERSION.zip.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FILES=(
            dist/Pomodoro.dmg
            dist/Pomodoro.dmg.sha256
            "dist/Pomodoro-$VERSION.zip"
            "dist/Pomodoro-$VERSION.zip.sha256"
            dist/appcast.xml
          )

          if [[ "$IS_BETA" == "1" ]]; then
            # The rolling beta release keeps a stable download URL for the
            # appcast that beta builds read, so its assets are replaced on
            # every beta.
            if ! gh release view "$BETA_TAG" >/dev/null 2>&1; then
              gh release create "$BETA_TAG" \
                --prerelease \
                --title "Pomodoro Beta" \
                --notes-file "$BETA_NOTES_FILE" \
                --target "$GITHUB_SHA"
            fi
            gh release upload "$BETA_TAG" \
              "dist/Pomodoro-$VERSION.zip" \
              dist/appcast.xml \
              --clobber
            gh release edit "$BETA_TAG" \
              --title "Pomodoro Beta" \
              --notes-file "$BETA_NOTES_FILE"
          else
            # Beta users follow the stable release once it ships, so point the
            # beta feed at the new stable appcast. Beta items never appear in
            # the stable feed because releases/latest skips pre-releases.
            if gh release view "$BETA_TAG" >/dev/null 2>&1; then
              gh release upload "$BETA_TAG" dist/appcast.xml --clobber
            else
              # Create the channel early so the switch never reads a missing
              # feed; the first beta replaces these assets.
              gh release create "$BETA_TAG" \
                --prerelease \
                --title "Pomodoro Beta" \
                --notes "Rolling beta channel for in-app beta updates. Betas appear here before a release." \
                --target "$GITHUB_SHA" \
                dist/appcast.xml
            fi
          fi

          # Re-running the workflow must update the existing release instead of
          # failing, so signing or notarization can be retried from the Actions
          # tab.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            if [[ "$IS_BETA" == "1" ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --notes-file "$NOTES_FILE" \
                --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            fi
          elif [[ "$IS_BETA" == "1" ]]; then
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Pomodoro $VERSION" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Pomodoro $VERSION" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi

      - name: Remove the temporary Sparkle key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-private-key"

      - name: Write the workflow summary
        run: |
          {
            echo "### Pomodoro $VERSION released"
            echo
            echo "- Build: \`$BUILD\`"
            if [[ "$IS_BETA" == "1" ]]; then
              echo "- Channel: \`beta\` (pre-release)"
            else
              echo "- Channel: \`stable\`"
            fi
            echo "- Disk image: \`Pomodoro.dmg\`"
            echo "- Update archive: \`Pomodoro-$VERSION.zip\`"
            echo "- Appcast: \`appcast.xml\`"
            if [[ -n "${SIGN_IDENTITY:-}" ]]; then
              echo "- Signing: \`$SIGN_IDENTITY\`"
            else
              echo "- Signing: ad hoc"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
